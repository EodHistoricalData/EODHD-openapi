Form4Meta:
  type: object
  description: Pagination metadata for the Insider Transactions v2 (SEC Form 4) endpoint.
  required:
  - total
  - page
  properties:
    total:
      type: integer
      minimum: 0
      description: Total number of filings available for the symbol.
    page:
      type: object
      required:
      - offset
      - limit
      properties:
        offset:
          type: integer
          minimum: 0
          description: Current page offset (zero-based).
        limit:
          type: integer
          minimum: 1
          description: Current page size.
