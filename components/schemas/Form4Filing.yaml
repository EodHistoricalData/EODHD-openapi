Form4Filing:
  type: object
  description: A single SEC Form 4 filing (one insider, one filing event) with its transactions and footnotes.
  required:
  - accession_number
  - filed_at
  - period_of_report
  - non_derivative
  - derivative
  - footnotes
  properties:
    accession_number:
      type: string
      description: SEC accession number — unique identifier of the filing on EDGAR.
    filed_at:
      type: string
      format: date
      description: Date the filing was submitted to the SEC (YYYY-MM-DD).
    period_of_report:
      type: string
      format: date
      description: Reporting period date covered by the filing (YYYY-MM-DD).
    non_derivative:
      type: array
      description: Direct stock transactions (common shares, restricted shares).
      items:
        $ref: ./Form4NonDerivative.yaml#/Form4NonDerivative
    derivative:
      type: array
      description: Derivative transactions (options, RSUs, warrants).
      items:
        $ref: ./Form4Derivative.yaml#/Form4Derivative
    footnotes:
      type: array
      description: Footnotes referenced from transactions in this filing.
      items:
        $ref: ./Form4Footnote.yaml#/Form4Footnote
