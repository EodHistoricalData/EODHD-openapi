/ust/yield-rates:
  get:
    summary: Get US Treasury yield curve rates
    description: Returns daily US Treasury Par Yield Curve Rates (nominal constant-maturity yields by tenor, 1-month through 30-year). The endpoint returns the full dataset for the selected year; it does not support pagination.
    operationId: GetUSTYieldRates
    parameters:
    - name: filter[year]
      in: query
      required: false
      description: Filter by calendar year (1900 – current year + 1). Defaults to the current year when omitted. Returns the full dataset for the selected year.
      schema:
        type: integer
        example: 2024
        minimum: 1900
    responses:
      '200':
        description: Successfully retrieved Treasury yield curve rates.
        content:
          application/json:
            schema:
              type: object
              properties:
                meta:
                  type: object
                  properties:
                    total:
                      type: integer
                      description: Total number of records in the response.
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                        description: Observation date.
                      tenor:
                        type: string
                        description: Maturity tenor (e.g., 1M, 6M, 2Y, 10Y, 30Y).
                      rate:
                        type: number
                        description: Par yield for the given tenor.
                links:
                  type: object
                  properties:
                    next:
                      type: [string, "null"]
                      description: Reserved for pagination; always null — the endpoint returns the full dataset.
      '401':
        description: Unauthorized. Invalid or missing API token.
      '403':
        description: Access forbidden. The user's plan does not include US Treasury data.
      '422':
        description: Unprocessable entity. Invalid query parameter (e.g., filter[year] out of range).
    tags:
    - US Treasury
