/sanctions/entities:
  get:
    summary: Get sanctioned entities
    description: Returns sanctioned entities (individuals and organizations) aggregated
      from OFAC and other sanctions sources, including programs, aliases, and identifiers.
    operationId: GetSanctionsEntities
    parameters:
    - name: source
      in: query
      required: false
      description: Filter by sanctions source.
      schema:
        type: string
        enum:
        - ofac
    - name: type
      in: query
      required: false
      description: Filter by entity type.
      schema:
        type: string
        enum:
        - individual
        - entity
        - vessel
        - aircraft
    - name: program
      in: query
      required: false
      description: Filter by sanctions program code.
      schema:
        type: string
    - name: country
      in: query
      required: false
      description: Filter by country.
      schema:
        type: string
    - name: q
      in: query
      required: false
      description: Free-text search query (minimum 2 characters).
      schema:
        type: string
        minLength: 2
    - name: active
      in: query
      required: false
      description: Filter by active listing status.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    - name: page[offset]
      in: query
      required: false
      description: Pagination offset (records to skip).
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: page[limit]
      in: query
      required: false
      description: Number of records per page. Default 20, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: fmt
      in: query
      required: false
      description: Output format.
      schema:
        type: string
        enum:
        - json
        - csv
        default: json
    responses:
      '200':
        description: Successfully retrieved sanctioned entities.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Resp_GetSanctionsEntities_200_application_json.yaml#/Resp_GetSanctionsEntities_200_application_json
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '422':
        description: |
          Validation error. Returned when a parameter is malformed or a filter value is invalid.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '429':
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
    tags:
    - Sanctions
