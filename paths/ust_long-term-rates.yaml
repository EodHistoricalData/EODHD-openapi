/ust/long-term-rates:
  get:
    summary: Get US Treasury long-term rates
    description: Returns daily US Treasury long-term rates. This feed combines "Daily Treasury Long-Term Rates" and "Daily Treasury Real Long-Term Rate Averages" into one dataset, keyed by rate_type. The endpoint returns the full dataset for the selected year; it does not support pagination.
    operationId: GetUSTLongTermRates
    parameters:
    - name: filter[year]
      in: query
      required: false
      description: Filter by calendar year (1900 – current year + 1). Defaults to the current year when omitted. Returns the full dataset for the selected year.
      schema:
        type: integer
        example: 2024
        minimum: 1900
    responses:
      '200':
        description: Successfully retrieved Treasury long-term rates.
        content:
          application/json:
            schema:
              type: object
              properties:
                meta:
                  type: object
                  properties:
                    total:
                      type: integer
                      description: Total number of records in the response.
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                        description: Observation date.
                      rate_type:
                        type: string
                        description: Rate series identifier (e.g., BC_20year, Over_10_Years, Real_Rate).
                      rate:
                        type: number
                        description: Rate value.
                      extrapolation_factor:
                        type: [number, "null"]
                        description: Extrapolation factor where applicable; null otherwise.
                links:
                  type: object
                  properties:
                    next:
                      type: [string, "null"]
                      description: Reserved for pagination; always null — the endpoint returns the full dataset.
      '401':
        description: Unauthorized. Invalid or missing API token.
      '403':
        description: Access forbidden. The user's plan does not include US Treasury data.
      '422':
        description: Unprocessable entity. Invalid query parameter (e.g., filter[year] out of range).
    tags:
    - US Treasury
