/etf/holdings/{ticker}:
  get:
    summary: ETF Holdings (beta)
    description: |
      Beta. Holdings of a US-listed ETF from its latest SEC N-PORT filing: all positions with
      weights, top 10 holdings, asset allocation, sector and region weights, and performance.
      US-listed ETFs only.

      The whole fund is returned in one response, without pagination (large funds are several MB,
      for example BND is about 5 MB). Response format is JSON; `fmt` is not supported.

      Cost: 10 API calls per request (a 404 also costs 10). Plans: Fundamentals Data Feed and All-In-One.
      The demo token works for VTI.
    operationId: GetEtfHoldings
    parameters:
    - name: ticker
      in: path
      required: true
      description: US ETF ticker, with or without the ".US" suffix (for example "VTI" or "VTI.US"). Case-insensitive. Other exchanges return 422.
      schema:
        type: string
    - name: api_token
      in: query
      required: true
      description: API token for authentication.
      schema:
        type: string
    responses:
      '200':
        description: |
          Successful response. For a fund with no positions `data.Holdings` is an empty list instead of an object.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Resp_GetEtfHoldings_200_application_json.yaml#/Resp_GetEtfHoldings_200_application_json
      '401':
        description: Unauthenticated. Plain text body `Unauthenticated` (missing or invalid token).
      '403':
        description: Forbidden. Plain text; the plan does not include the ETF Holdings API.
      '404':
        description: Not found. JSON with a coded error. FUND_NOT_FOUND (no fund with this ticker), NOT_COVERED (outside coverage, for example commodity or crypto ETPs and ETNs, some small funds), NO_HOLDINGS_YET (known fund with no N-PORT filing yet).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/EtfHoldingsError.yaml#/EtfHoldingsError
      '422':
        description: Validation error, for example a non-US ticker such as CSPX.LSE (ETF data is available for US-listed securities only).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/EtfHoldingsError.yaml#/EtfHoldingsError
      '429':
        description: Too Many Requests. Rate limit of the plan.
    tags:
    - ETF Holdings
    externalDocs:
      description: ETF Holdings API documentation
      url: https://eodhd.com/financial-apis/etf-holdings-api
