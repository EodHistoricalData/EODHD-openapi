/mp/unicornbay/options/underlying-symbols:
  get:
    summary: List underlying symbols with options
    description: Returns the list of all supported stock symbols for which option
      contracts are available. Not paginated, the full list comes back in one response.
    operationId: listUnderlyingSymbols
    parameters:
    - name: fmt
      in: query
      schema:
        type: string
        enum:
        - json
        - xml
        default: json
      description: Response format.
    responses:
      '200':
        description: Supported underlying symbols.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/UnderlyingSymbolsResponse.yaml#/UnderlyingSymbolsResponse
            examples:
              sample:
                summary: First page (truncated)
                value:
                  meta:
                    total: 7019
                    fields:
                    - underlying_symbol
                    compact: true
                  data:
                  - A
                  - AA
                  - AAAU
                  - AACT
                  - AADI
                  - AAL
                  - AAMI
                  - AAN
                  - AAOI
                  - AAON
                  - AAP
                  - AAPL
                  links:
                    next: ""
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '422':
        description: Unprocessable Entity
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '429':
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
    tags:
    - Options
