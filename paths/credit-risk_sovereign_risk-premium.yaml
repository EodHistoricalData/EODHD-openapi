/credit-risk/sovereign/risk-premium:
  get:
    summary: Get sovereign country risk premiums
    description: Returns country-level default spreads, country risk premiums, equity
      risk premiums, corporate tax rates, and related sovereign credit metrics.
    operationId: GetSovereignRiskPremium
    parameters:
    - name: filter[country]
      in: query
      required: false
      description: Filter by country name or ISO Alpha-3 code (e.g., 'USA' or 'Germany').
      schema:
        type: string
    - name: filter[region]
      in: query
      required: false
      description: Filter by region name.
      schema:
        type: string
    - name: filter[as_of]
      in: query
      required: false
      description: Filter by the as-of date (YYYY-MM-DD).
      schema:
        type: string
        format: date
    - name: page[offset]
      in: query
      required: false
      description: Pagination offset (records to skip).
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: page[limit]
      in: query
      required: false
      description: Number of records per page. Default 20, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: fmt
      in: query
      required: false
      description: Output format.
      schema:
        type: string
        enum:
        - json
        - csv
        default: json
    responses:
      '200':
        description: Successfully retrieved sovereign risk premium data.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Resp_GetSovereignRiskPremium_200_application_json.yaml#/Resp_GetSovereignRiskPremium_200_application_json
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '422':
        description: |
          Validation error. Returned when a parameter is malformed or a filter value is invalid.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '429':
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
    tags:
    - Credit & Sovereign Risk
