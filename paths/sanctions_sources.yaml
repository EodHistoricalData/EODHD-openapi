/sanctions/sources:
  get:
    summary: Get sanctions sources
    description: Returns the list of sanctions data sources available in the dataset.
    operationId: GetSanctionsSources
    parameters:
    - name: page[offset]
      in: query
      required: false
      description: Pagination offset (records to skip).
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: page[limit]
      in: query
      required: false
      description: Number of records per page. Default 20, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: fmt
      in: query
      required: false
      description: Output format.
      schema:
        type: string
        enum:
        - json
        - csv
        default: json
    responses:
      '200':
        description: Successfully retrieved sanctions sources.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Resp_GetSanctionsSources_200_application_json.yaml#/Resp_GetSanctionsSources_200_application_json
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '429':
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
    tags:
    - Sanctions
