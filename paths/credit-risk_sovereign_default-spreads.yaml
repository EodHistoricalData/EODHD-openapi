/credit-risk/sovereign/default-spreads:
  get:
    summary: Get default spreads by rating
    description: Returns default spreads mapped to credit rating buckets.
    operationId: GetSovereignDefaultSpreads
    parameters:
    - name: filter[rating]
      in: query
      required: false
      description: Filter by credit rating bucket (e.g., 'Aaa', 'Baa2').
      schema:
        type: string
    - name: filter[as_of]
      in: query
      required: false
      description: Filter by the as-of date (YYYY-MM-DD).
      schema:
        type: string
        format: date
    - name: page[offset]
      in: query
      required: false
      description: Pagination offset (records to skip).
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: page[limit]
      in: query
      required: false
      description: Number of records per page. Default 20, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: fmt
      in: query
      required: false
      description: Output format.
      schema:
        type: string
        enum:
        - json
        - csv
        default: json
    responses:
      '200':
        description: Successfully retrieved default spreads by rating.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Resp_GetSovereignDefaultSpreads_200_application_json.yaml#/Resp_GetSovereignDefaultSpreads_200_application_json
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '422':
        description: |
          Validation error. Returned when a parameter is malformed or a filter value is invalid.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '429':
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
    tags:
    - Credit & Sovereign Risk
