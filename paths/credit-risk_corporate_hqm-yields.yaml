/credit-risk/corporate/hqm-yields:
  get:
    summary: Get high quality market (HQM) corporate bond yields
    description: Returns High Quality Market corporate bond yield curve values (par
      and spot) across standard tenors.
    operationId: GetCorporateHqmYields
    parameters:
    - name: filter[tenor]
      in: query
      required: false
      description: Filter by tenor in years (e.g., 1, 2, 3, 5, 7, 10, 15, 20, 25, 30).
      schema:
        type: integer
        example: 10
    - name: filter[type]
      in: query
      required: false
      description: Yield curve type.
      schema:
        type: string
        enum:
        - par
        - spot
    - name: filter[from]
      in: query
      required: false
      description: Start date (YYYY-MM-DD).
      schema:
        type: string
        format: date
    - name: filter[to]
      in: query
      required: false
      description: End date (YYYY-MM-DD).
      schema:
        type: string
        format: date
    - name: page[offset]
      in: query
      required: false
      description: Pagination offset (records to skip).
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: page[limit]
      in: query
      required: false
      description: Number of records per page.
      schema:
        type: integer
        minimum: 1
    - name: fmt
      in: query
      required: false
      description: Output format.
      schema:
        type: string
        enum:
        - json
        - csv
        default: json
    responses:
      '200':
        description: Successfully retrieved HQM corporate bond yields.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Resp_GetCorporateHqmYields_200_application_json.yaml#/Resp_GetCorporateHqmYields_200_application_json
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
      '429':
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Error.yaml#/Error
    tags:
    - Credit & Sovereign Risk
