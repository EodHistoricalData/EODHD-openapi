/ust/bill-rates:
  get:
    summary: Get US Treasury bill rates
    description: Returns daily US Treasury Bill Rates (T-Bills) — discount and coupon-equivalent rates, average rates, maturity date, and CUSIP, by tenor. The endpoint returns the full dataset for the selected year; it does not support pagination.
    operationId: GetUSTBillRates
    parameters:
    - name: filter[year]
      in: query
      required: false
      description: Filter by calendar year (1900 – current year + 1). Defaults to the current year when omitted. Returns the full dataset for the selected year.
      schema:
        type: integer
        example: 2024
        minimum: 1900
    responses:
      '200':
        description: Successfully retrieved Treasury bill rates.
        content:
          application/json:
            schema:
              type: object
              properties:
                meta:
                  type: object
                  properties:
                    total:
                      type: integer
                      description: Total number of records in the response.
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                        description: Observation date.
                      tenor:
                        type: string
                        description: Bill tenor (e.g., 4WK, 13WK, 26WK, 52WK).
                      discount:
                        type: number
                        description: Bank discount rate.
                      coupon:
                        type: number
                        description: Coupon-equivalent rate.
                      avg_discount:
                        type: number
                        description: Average bank discount rate.
                      avg_coupon:
                        type: number
                        description: Average coupon-equivalent rate.
                      maturity_date:
                        type: string
                        format: date
                        description: Maturity date.
                      cusip:
                        type: string
                        description: CUSIP identifier.
                links:
                  type: object
                  properties:
                    next:
                      type: [string, "null"]
                      description: Reserved for pagination; always null — the endpoint returns the full dataset.
      '401':
        description: Unauthorized. Invalid or missing API token.
      '403':
        description: Access forbidden. The user's plan does not include US Treasury data.
      '422':
        description: Unprocessable entity. Invalid query parameter (e.g., filter[year] out of range).
    tags:
    - US Treasury
